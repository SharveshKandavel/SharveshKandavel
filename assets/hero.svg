<circle class="s" cx="55"  cy="322" r=".7"  style="--d:3.8s;--dl:2.4s;--op:.5"/>
<circle class="s" cx="172" cy="342" r="1.2" style="--d:2.8s;--dl:.6s;--op:.7"/>
<circle class="s" cx="38"  cy="375" r=".9"  style="--d:3.4s;--dl:1.3s;--op:.6"/>
<!-- Center-left -->
<circle class="s" cx="302" cy="26"  r=".9"  style="--d:3.2s;--dl:.9s;--op:.7"/>
<circle class="s" cx="275" cy="105" r="1.2" style="--d:2.5s;--dl:1.6s;--op:.7"/>
<circle class="s" cx="342" cy="60"  r="1.7" style="--d:3.9s;--dl:.3s;--op:.9"/>
<circle class="s" cx="312" cy="335" r="1.3" style="--d:2.1s;--dl:2.0s;--op:.8"/>
<circle class="s" cx="262" cy="358" r=".8"  style="--d:3.6s;--dl:.8s;--op:.6"/>
<circle class="s" cx="308" cy="380" r="1.1" style="--d:2.7s;--dl:1.2s;--op:.7"/>
<!-- Right cluster -->
<circle class="s" cx="595" cy="20"  r="1.4" style="--d:3.3s;--dl:1.2s;--op:.8"/>
<circle class="s" cx="662" cy="46"  r=".9"  style="--d:2.8s;--dl:.5s;--op:.6"/>
<circle class="s" cx="725" cy="25"  r="2.0" style="--d:4.1s;--dl:1.8s;--op:1"/>
<circle class="s" cx="815" cy="90"  r="1.1" style="--d:2.4s;--dl:.3s;--op:.7"/>
<circle class="s" cx="865" cy="36"  r="1.5" style="--d:3.7s;--dl:2.3s;--op:.9"/>
<circle class="s" cx="755" cy="125" r=".8"  style="--d:2.9s;--dl:.9s;--op:.6"/>
