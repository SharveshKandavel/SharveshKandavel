<circle class="s" cx="45"  cy="145" r="2.6" style="--d:4.2s;--dl:.4s;--op:1"/>

<!-- ── Constellation lines ────────────────────────────── -->
<line x1="38"  y1="26"  x2="85"  y2="50"  stroke="#fff" stroke-width=".3" opacity=".08"/>
<line x1="85"  y1="50"  x2="152" y2="16"  stroke="#fff" stroke-width=".3" opacity=".08"/>
<line x1="192" y1="65"  x2="152" y2="16"  stroke="#fff" stroke-width=".3" opacity=".08"/>
<line x1="105" y1="125" x2="85"  y2="50"  stroke="#fff" stroke-width=".3" opacity=".06"/>
<line x1="725" y1="25"  x2="662" y2="46"  stroke="#fff" stroke-width=".3" opacity=".08"/>
<line x1="725" y1="25"  x2="815" y2="90"  stroke="#fff" stroke-width=".3" opacity=".08"/>
<line x1="865" y1="36"  x2="815" y2="90"  stroke="#fff" stroke-width=".3" opacity=".08"/>
<line x1="865" y1="36"  x2="875" y2="125" stroke="#fff" stroke-width=".3" opacity=".07"/>
<line x1="685" y1="275" x2="755" y2="125" stroke="#fff" stroke-width=".3" opacity=".06"/>

<!-- ── Scan line ──────────────────────────────────────── -->
<rect class="sl" x="0" y="0" width="900" height="1.5" rx=".75" fill="url(#divG)"/>

<!-- ════════ CORNER BRACKETS ════════ -->
<g class="cn" style="--cd:0s">
  <polyline points="22,56 22,22 56,22" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round"/>
</g>
<g class="cn" style="--cd:-.9s">
  <polyline points="878,56 878,22 844,22" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
</g>
<g class="cn" style="--cd:-.5s">
  <polyline points="22,344 22,378 56,378" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-linecap="round"/>
</g>
<g class="cn" style="--cd:-1.4s">
  <polyline points="878,344 878,378 844,378" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
</g>

<!-- ════════ ORBITING PARTICLES ════════ -->
<!--
  Elliptical orbits centered at (450, 175) — visual center of the name.
  Large orbit: rx=225, ry=108  →  right point (675,175), left (225,175)
  Small orbit: rx=155, ry=72   →  right point (605,175), left (295,175)
  Using two-arc technique for reliable looping.
-->

<!-- Orbit 1 — large, purple, slow (14s) -->
<circle r="5" fill="#c084fc" filter="url(#g6)">
  <animateMotion dur="14s" repeatCount="indefinite"
    path="M 675,175 A 225,108 0 1 1 225,175 A 225,108 0 1 1 675,175"/>
</circle>

<!-- Orbit 2 — large, cyan, medium reverse (10s), offset start -->
<circle r="3.5" fill="#7dd3fc" filter="url(#g6)">
  <animateMotion dur="10s" repeatCount="indefinite" begin="-3.3s"
    path="M 675,175 A 225,108 0 1 0 225,175 A 225,108 0 1 0 675,175"/>
</circle>

<!-- Orbit 3 — small, amber, fast (7s) -->
<circle r="2.8" fill="#fde68a" filter="url(#g3)">
  <animateMotion dur="7s" repeatCount="indefinite" begin="-1.8s"
    path="M 605,175 A 155,72 0 1 1 295,175 A 155,72 0 1 1 605,175"/>
</circle>

<!-- Orbit 4 — tiny, white, fastest reverse (5s) -->
<circle r="1.8" fill="#fff" filter="url(#g3)" opacity=".7">
  <animateMotion dur="5s" repeatCount="indefinite" begin="-2.5s"
    path="M 605,175 A 155,72 0 1 0 295,175 A 155,72 0 1 0 605,175"/>
</circle>

