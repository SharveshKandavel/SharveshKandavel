<circle class="s" cx="855" cy="345" r="1.8" style="--d:3.8s;--dl:1.6s;--op:1"/>
<circle class="s" cx="625" cy="335" r=".8"  style="--d:2.9s;--dl:2.5s;--op:.5"/>
