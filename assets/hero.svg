<circle class="s" cx="175" cy="36"  r="2.6" style="--d:4.6s;--dl:1.7s;--op:1"/>
<circle class="s" cx="705" cy="350" r="2.6" style="--d:3.7s;--dl:.9s;--op:1"/>
