<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 400" width="900" height="400">
<defs>

  <!-- ── Gradients ─────────────────────────────────────── -->
  <linearGradient id="bg" x1="0" y1="0" x2=".4" y2="1">
    <stop offset="0%"   stop-color="#04030f"/>
    <stop offset="100%" stop-color="#0b061e"/>
  </linearGradient>

  <linearGradient id="nameG" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#d946ef"/>
    <stop offset="30%"  stop-color="#a855f7"/>
    <stop offset="60%"  stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#d946ef"/>
  </linearGradient>

  <linearGradient id="divG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="#a855f7" stop-opacity="0"/>
    <stop offset="25%"  stop-color="#a855f7"/>
    <stop offset="55%"  stop-color="#38bdf8"/>
    <stop offset="80%"  stop-color="#06b6d4"/>
    <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="orbP" cx="50%" cy="50%">
    <stop offset="0%"   stop-color="#7c3aed" stop-opacity=".65"/>
    <stop offset="55%"  stop-color="#7c3aed" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="orbC" cx="50%" cy="50%">
    <stop offset="0%"   stop-color="#0e7490" stop-opacity=".55"/>
    <stop offset="55%"  stop-color="#0e7490" stop-opacity=".1"/>
    <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="orbS" cx="50%" cy="50%">
    <stop offset="0%"   stop-color="#6d28d9" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
  </radialGradient>

  <!-- ── Glow filters ──────────────────────────────────── -->
  <filter id="g3" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="g6" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="g12" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="12" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- ── Animations ────────────────────────────────────── -->
  <style>
    /* Stars: twinkling via custom properties */
    .s { fill: #fff; animation: tw var(--d,3s) ease-in-out var(--dl,0s) infinite alternate; }
    @keyframes tw {
      0%   { opacity: .08; }
      100% { opacity: var(--op,.85); }
    }

    /* Orb pulse */
    .ob { animation: op var(--od,6s) ease-in-out var(--dly,0s) infinite alternate; }
    @keyframes op { 0%{opacity:.5} 100%{opacity:1} }

    /* Name glow shift */
    .nm {
      animation: ng 4s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 10px #a855f7aa) drop-shadow(0 0 28px #7c3aed66);
    }
    @keyframes ng {
      0%   { filter: drop-shadow(0 0 10px #a855f7aa) drop-shadow(0 0 28px #7c3aed66); }
      100% { filter: drop-shadow(0 0 14px #38bdf8cc) drop-shadow(0 0 36px #0ea5e966); }
    }

    /* Scan line sweep */
    .sl {
      animation: sl 7s linear infinite;
      opacity: 0;
    }
    @keyframes sl {
      0%   { transform: translateY(-5px); opacity: 0; }
      5%   { opacity: .18; }
      90%  { opacity: .18; }
      100% { transform: translateY(405px); opacity: 0; }
    }

    /* Corner brackets blink */
    .cn { animation: cn 3s ease-in-out var(--cd,0s) infinite alternate; }
    @keyframes cn { 0%{opacity:.2} 100%{opacity:.9} }

    /* Role badge float */
    .bd { animation: bf var(--bd,3s) ease-in-out var(--bdy,0s) infinite alternate; }
    @keyframes bf { 0%{transform:translateY(0)} 100%{transform:translateY(-5px)} }

    /* Divider shimmer */
    .dv { animation: dv 3s ease-in-out infinite; }
    @keyframes dv { 0%,100%{opacity:.6} 50%{opacity:1} }

    /* Sequential appear */
    .a1{animation:ap .9s .1s ease both}
    .a2{animation:ap .9s .5s ease both}
    .a3{animation:ap .9s .9s ease both}
    .a4{animation:ap .9s 1.3s ease both}
    .a5{animation:ap .9s 1.7s ease both}
    .a6{animation:ap .9s 2.1s ease both}
    .a7{animation:ap .9s 2.5s ease both}
    @keyframes ap {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>

</defs>

<!-- ════════ BACKGROUND ════════ -->
<rect width="900" height="400" fill="url(#bg)"/>

<!-- ── Cosmic orbs ────────────────────────────────────── -->
<ellipse class="ob" cx="60"  cy="340" rx="290" ry="290" fill="url(#orbP)" style="--od:7s;--dly:0s"/>
<ellipse class="ob" cx="850" cy="65"  rx="250" ry="250" fill="url(#orbC)" style="--od:5s;--dly:-2s"/>
<ellipse class="ob" cx="840" cy="355" rx="140" ry="140" fill="url(#orbS)" style="--od:8s;--dly:-1s"/>
<ellipse class="ob" cx="200" cy="30"  rx="100" ry="100" fill="url(#orbP)" style="--od:6s;--dly:-3s;opacity:.4"/>

<!-- ════════ STARS ════════ -->
<!-- Left cluster -->
<circle class="s" cx="38"  cy="26"  r="1.2" style="--d:2.4s;--dl:.2s;--op:.8"/>
<circle class="s" cx="85"  cy="50"  r="1.9" style="--d:3.1s;--dl:.8s;--op:1"/>
<circle class="s" cx="25"  cy="85"  r=".9"  style="--d:2.7s;--dl:1.4s;--op:.6"/>
<circle class="s" cx="152" cy="16"  r="1.1" style="--d:3.7s;--dl:.5s;--op:.8"/>
<circle class="s" cx="105" cy="125" r="1.5" style="--d:2.2s;--dl:1.9s;--op:.9"/>
<circle class="s" cx="50"  cy="168" r=".8"  style="--d:4.3s;--dl:.1s;--op:.6"/>
<circle class="s" cx="192" cy="65"  r="2.3" style="--d:2.9s;--dl:2.2s;--op:1"/>
<circle class="s" cx="65"  cy="215" r="1.0" style="--d:3.5s;--dl:.7s;--op:.7"/>
