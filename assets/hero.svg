<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');

      .terminal-bg { fill: #0d1117; }
      .terminal-bar { fill: #161b22; }
      .btn-red { fill: #ff5f57; }
      .btn-yellow { fill: #ffbd2e; }
      .btn-green { fill: #28c840; }

      .prompt { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .comment { fill: #6e7681; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; }
      .green   { fill: #3fb950; }
      .cyan    { fill: #79c0ff; }
      .white   { fill: #e6edf3; }
      .purple  { fill: #d2a8ff; }
      .orange  { fill: #ffa657; }
      .yellow  { fill: #e3b341; }

      .cursor {
        fill: #58a6ff;
        animation: blink 1.1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .fade-in-1 { animation: fadeIn 0.4s ease 0.2s both; }
      .fade-in-2 { animation: fadeIn 0.4s ease 0.6s both; }
      .fade-in-3 { animation: fadeIn 0.4s ease 1.0s both; }
      .fade-in-4 { animation: fadeIn 0.4s ease 1.4s both; }
      .fade-in-5 { animation: fadeIn 0.4s ease 1.8s both; }
      .fade-in-6 { animation: fadeIn 0.4s ease 2.2s both; }
      .fade-in-7 { animation: fadeIn 0.4s ease 2.6s both; }
      .fade-in-8 { animation: fadeIn 0.4s ease 3.0s both; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="12" class="terminal-bg"/>

  <!-- Top accent line -->
  <rect width="900" height="2" rx="1" fill="url(#topGrad)"/>

  <!-- Title bar -->
  <rect width="900" height="36" rx="0" class="terminal-bar" y="2"/>
  <rect width="900" height="1" fill="#30363d" y="38"/>

  <!-- Window buttons -->
  <circle cx="24" cy="20" r="6" class="btn-red"/>
  <circle cx="44" cy="20" r="6" class="btn-yellow"/>
  <circle cx="64" cy="20" r="6" class="btn-green"/>

  <!-- Tab label -->
  <text x="450" y="25" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#8b949e">sharvesh@github ~ zsh</text>

  <!-- Line 1: whoami command -->
  <g class="fade-in-1">
    <text x="28" y="72" class="prompt green">❯</text>
    <text x="44" y="72" class="prompt white"> whoami</text>
  </g>

  <!-- Line 2: name output -->
  <g class="fade-in-2">
    <text x="28" y="96" class="prompt purple" font-weight="bold" font-size="15">Sharvesh Kandavel</text>
  </g>

  <!-- Line 3: ls projects -->
  <g class="fade-in-3">
    <text x="28" y="126" class="prompt green">❯</text>
    <text x="44" y="126" class="prompt white"> cat about.txt</text>
  </g>

  <!-- Line 4: about content -->
  <g class="fade-in-4">
    <text x="28" y="150" class="prompt comment"># Engineering student · Full-Stack Dev · Embedded Systems</text>
  </g>
  <g class="fade-in-5">
    <text x="28" y="169" class="prompt comment"># Building: AI apps · hardware projects · crypto tools</text>
  </g>

  <!-- Line 5: tech command -->
  <g class="fade-in-6">
    <text x="28" y="199" class="prompt green">❯</text>
    <text x="44" y="199" class="prompt white"> ls ./tech-stack</text>
  </g>

  <!-- Line 6: tech badges row -->
  <g class="fade-in-7">
    <text x="28"  y="222" class="prompt cyan">TypeScript</text>
    <text x="118" y="222" class="prompt white">  ·  </text>
    <text x="148" y="222" class="prompt orange">JavaScript</text>
    <text x="243" y="222" class="prompt white">  ·  </text>
    <text x="273" y="222" class="prompt yellow">C++</text>
    <text x="305" y="222" class="prompt white">  ·  </text>
    <text x="335" y="222" class="prompt cyan">React</text>
    <text x="381" y="222" class="prompt white">  ·  </text>
    <text x="411" y="222" class="prompt orange">Next.js</text>
    <text x="467" y="222" class="prompt white">  ·  </text>
    <text x="497" y="222" class="prompt green">Node.js</text>
    <text x="557" y="222" class="prompt white">  ·  </text>
    <text x="587" y="222" class="prompt purple">Arduino</text>
  </g>

  <!-- Line 7: cursor line -->
  <g class="fade-in-8">
    <text x="28" y="252" class="prompt green">❯</text>
    <rect x="44" y="240" width="9" height="16" class="cursor" rx="1"/>
  </g>
</svg>
